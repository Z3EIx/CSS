<head>
    <title>styl wewnetzny użycie Hn</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
        h1 { color: green }
        h3 { color: blue }
        h6 { color: red }
  
    </style>
</head>
<body>
    <h1>to jest tekst pisany h1</h1>
    <h3>to jest tekst pisany h3</h3>
    <h6>
        styl wewnetzny<br>
        zdefiniowany w znacznik h6
    </h6>
</body>
</html>
